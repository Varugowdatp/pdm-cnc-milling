<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PdM SCADA — Predictive Maintenance HMI</title>
<link rel="stylesheet" href="/css/style.css" />
<!-- PWA: installable app (manifest + service worker in js/pwa.js) -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b1220" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PdM SCADA" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />
</head>
<body>

<div id="app">

  <!-- ============================================================
       TOP BAR
       ============================================================ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>PREDICTIVE MAINTENANCE</h1>
        <p>CNC Milling Machine Monitoring</p>
      </div>
    </div>

    <nav class="nav" id="nav">
      <a href="#/overview"  data-route="overview">Plant Overview</a>
      <a href="#/machine"   data-route="machine">Machine HMI</a>
      <a href="#/manual"    data-route="manual">Manual Input</a>
      <a href="#/batch"     data-route="batch">Batch Analysis</a>
      <a href="#/alarms"    data-route="alarms">Alarms</a>
      <a href="#/model"     data-route="model">Model Insights</a>
    </nav>

    <div class="status-cluster">
      <div class="conn">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-text">connecting…</span>
      </div>
      <button class="btn sm primary" id="install-btn" hidden title="Install this HMI as an app">Install app</button>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <!-- ============================================================
       SCREENS
       ============================================================ -->
  <main id="screen-overview" class="screen" hidden></main>
  <main id="screen-machine"  class="screen" hidden></main>
  <main id="screen-manual"   class="screen" hidden></main>
  <main id="screen-batch"    class="screen" hidden></main>
  <main id="screen-alarms"   class="screen" hidden></main>
  <main id="screen-model"    class="screen" hidden></main>

</div>

<div class="toast-host" id="toasts"></div>

<!-- LOAD ORDER MATTERS.
     app.js declares `const SCREENS = {}` and every screen script registers
     itself on it, so app.js MUST come first. A `const` at the top level of a
     classic script lives in the global lexical environment, and a script that
     runs earlier cannot see it - so loading app.js last made all six screen
     scripts fail with "SCREENS is not defined" and the router found nothing.

     Boot is safe here: app.js only starts on DOMContentLoaded, which fires
     after every one of these scripts has run and registered. -->
<script src="/js/pwa.js"></script>
<script src="/js/api.js"></script>
<script src="/js/widgets.js"></script>
<script src="/js/app.js"></script>
<script src="/js/screens/overview.js"></script>
<script src="/js/screens/machine.js"></script>
<script src="/js/screens/manual.js"></script>
<script src="/js/screens/batch.js"></script>
<script src="/js/screens/alarms.js"></script>
<script src="/js/screens/model.js"></script>

</body>
</html>
